# This file provides the data paths and control parameters for the example_process_single_facet.py example.
#
# This file demonstrates a scenario where a systematic file and directory convention is used to track 
# multiple measurements of multiple mirrors, in a facility with multiple optical metrology setups,
# and under multiple settings of analysis parameters and output control.
#
# For detailed instructions on the context, see the default processing file:
#    20250818_163443_SNLTF-A_OLSLrsqw_p001_default_process_single_facet_settings_Q.ini
#
# This version is modified to compare against a plano reference mirror.
#

[Default]
# Whether to output detailed progress output, intermediate calculation results, etc.
verbose = True

# Strings to denote this computation.  Must be contiguous, with no space, tabs or line feeds.
measurement_id  = 20250818_163443_SLTF-A_OLSLrsqw
post_process_id = p004_ref_plano

# Input
file_camera      = Q:\Instruments\OLSL_OpticsLabSofastLandscape\camera_sofast_optics_lab_landscape_2025_02.h5
file_orientation = Q:\Instruments\OLSL_OpticsLabSofastLandscape\spatial_orientation_optics_lab_landscape.h5
file_display     = Q:\Instruments\OLSL_OpticsLabSofastLandscape\OLSLrsqw_OpticsLabSofastLandscapeFringeSquareWhite\display_shape_optics_lab_landscape_square_distorted_3d_100x100.h5
file_facet       = Q:\Mirrors\SNLTF\0_Common\Facet_NSTTF.json
file_calibration = Q:\Mirrors\SNLTF\SNLTF-A\20250818_163443_OLSLrsqw\A_Collect\A1_intensity_response\image_calibration_scaling_20250818_163358.h5
file_measurement = Q:\Mirrors\SNLTF\SNLTF-A\20250818_163443_OLSLrsqw\A_Collect\A2_collection_result\20250818_163443_measurement_fringe.h5

# Directory to write output files.
# (The post_process_id below will be added as a suffix.)
dir_save_root = Q:\Mirrors\SNLTF\SNLTF-A\20250818_163443_OLSLrsqw\B_Post

# Analysis control parameters
# Distance values are meters.
fit_initial_focal_length_x = 300.0
fit_initial_focal_length_y = 300.0
fit_robust_least_squares = True
fit_downsample = 10

# Reference mirror
# As of this writing, surface choices are "symmetric_paraboloid", "astigmatic_paraboloid", and "plano".
# Distance values are meters.
#reference_mirror_surface_type = symmetric_paraboloid
#reference_mirror_focal_length_x = 100.0
#reference_mirror_focal_length_y = None
#reference_mirror_surface_type = astigmatic_paraboloid
#reference_mirror_focal_length_x = 100.0
#reference_mirror_focal_length_y = 400.0
reference_mirror_surface_type = plano

# Output control
# Output control flags are optional and may be omitted if brevity is desired.
# ---------------------------------------------------------------------------
output_fringe_images = True

# Plot control parameters
# For detaled definitions and default values, see StandardPlotOutput.py, particularly the classes 
# _OptionsFileOutput, _OptionsSlopeVis, _OptionsSlopeDeviationVis, _OptionsCurvatureVis, _OptionsRayTraceVis, and _RayTraceParameters.
#
# Plot control flags are optional and may be omitted if brevity is desired.
# -------------------------------------------------------------------------
# File output control
plots.options_file_output.to_save = True
plots.options_file_output.save_dpi = 200
plots.options_file_output.save_format = png
plots.options_file_output.close_after_save = False
plots.options_file_output.number_in_name = False

# Slope plot control
plots.options_slope_vis.resolution = 0.001
plots.options_slope_vis.clim = 7
plots.options_slope_vis.quiver_density = 0.1
plots.options_slope_vis.quiver_scale = 25
plots.options_slope_vis.quiver_color = white
plots.options_slope_vis.to_plot = True

# Slope deviation plot control
plots.options_slope_deviation_vis.resolution = 0.001
plots.options_slope_deviation_vis.clim = 1.5
plots.options_slope_deviation_vis.quiver_density = 0.1
plots.options_slope_deviation_vis.quiver_scale = 25
plots.options_slope_deviation_vis.quiver_color = white
plots.options_slope_deviation_vis.to_plot = True

# Curvature plot control
plots.options_curvature_vis.resolution = 0.001
plots.options_curvature_vis.clim = 50
plots.options_curvature_vis.processing_1 = None
plots.options_curvature_vis.processing_2 = None
plots.options_curvature_vis.smooth_kernel_width = 1
plots.options_curvature_vis.to_plot = True

# Ray trace plot control
plots.options_ray_trace_vis.ray_trace_optic_res = 0.05
plots.options_ray_trace_vis.hist_bin_res = 0.07
plots.options_ray_trace_vis.hist_extent = 3
plots.options_ray_trace_vis.enclosed_energy_max_semi_width = 1
plots.options_ray_trace_vis.to_plot = True

# Ray trace parameters
plots.options_ray_trace_vis.sun_direction_x = 0
plots.options_ray_trace_vis.sun_direction_y = 0
plots.options_ray_trace_vis.sun_direction_z = -1
plots.options_ray_trace_vis.sun_sample_resolution = 40

plots.options_ray_trace_vis.v_target_center_x = 0
plots.options_ray_trace_vis.v_target_center_y = 0
plots.options_ray_trace_vis.v_target_center_z = 100

plots.options_ray_trace_vis.v_target_normal_x = 0
plots.options_ray_trace_vis.v_target_normal_y = 0
plots.options_ray_trace_vis.v_target_normal_z = -1
