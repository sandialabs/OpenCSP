[project]
name = "pyffiam"
version = "3.0.0"
authors = [
  { name="Cianan Sims", email="cianan@simsindustries.com" },
]
description = "Full-field Irradiance Analysis Model performs volumetric irradiance analysis of airspace around and above concentrating solar plants."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]

dependencies = [
    "kaleido>=0.1.0.post1,<1.0",  # 0.1.0.post1 on Windows, 0.2.1 on Linux; >=1.0 breaks plotly write_image
    "moviepy>=2.1.2",
    "numpy==2.2.4",
    "pandas==2.2.3",
    "pillow==10.4.0",
    "platformdirs>=4.0.0",
    "plotly==6.0.1",
    "scipy==1.15.2",
    "xlsxwriter==3.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*TestCase"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "WARNING"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true